principles:
  - "Evidence retrieval only identifies candidate Career Master facts."
  - "Evidence retrieval never decides MATCH, PARTIAL_MATCH, GAP or UNKNOWN."
  - "Only active, confirmed facts from the immutable canonical PROFILE source are eligible."
  - "Primary facts carry direct evidence; supporting facts provide context only."
  - "Absence of candidate evidence never implies GAP."
  - "GAP requires explicit evidence of non-compliance or contradiction."
  - "Keyword overlap alone is never sufficient to establish MATCH."
  - "UNKNOWN is preferred when available evidence is insufficient to support a conclusion."