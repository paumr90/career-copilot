version: "0.2"

principles:
  - "Only fields necessary to assess the current requirement category may leave the local Career Master boundary."
  - "Evidence retrieval decides which ProfileFacts are candidates; projection only minimizes their value_json payload."
  - "Fields not explicitly allowlisted are excluded."
  - "Projection never modifies the underlying canonical Career Master fact."
  - "Projection never upgrades supporting evidence to primary evidence."
  - "An empty projected value_json is allowed when subject and metadata still identify the evidence."
  - "Data minimization must happen before any external semantic provider receives Career Master evidence."

