version: "0.1"

match_scores:
  MATCH: 1.0
  PARTIAL_MATCH: 0.5
  GAP: 0.0

priority_weights:
  MUST_HAVE: 5.0
  NICE_TO_HAVE: 2.0
  SECONDARY: 1.0

recommendation:
  apply_threshold: 70.0
  at_or_above_threshold: "APPLY"
  below_threshold: "NO_APPLY"

blocking_rules:
  blocking_must_have_gap: "NO_APPLY"
  blocking_must_have_partial_match: "REVIEW"

uncertainty_rules:
  any_must_have_unknown: "REVIEW"
  no_known_requirements: "REVIEW"

principles:
  - "Blocking must-have gaps override the numerical score."
  - "UNKNOWN is not treated as GAP."
  - "UNKNOWN requirements are excluded from the numerical score denominator."
  - "A high score cannot override a confirmed blocking must-have gap."
  - "An unknown must-have prevents an automatic APPLY recommendation."
  - "A partial match on a blocking must-have requires review."
  - "Every MATCH, PARTIAL_MATCH and GAP must be supported by Career Master evidence."
  - "The Rules Engine calculates fit; the LLM does not decide the numerical score."