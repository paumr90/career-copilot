version: "0.2"

role: "requirement_assessment_proposer"

input:
  include_requirement:
    - requirement_key
    - description
    - priority
    - category
    - blocking
    - evidence_text

  include_ranked_evidence:
    - profile_fact_id
    - fact_type
    - tier
    - subject
    - value_json
    - relevance_score
    - matched_terms

  maximum_ranked_evidence: 8

output:
  schema: "RequirementAssessmentProposal"

  allowed_statuses:
    - "MATCH"
    - "PARTIAL_MATCH"
    - "GAP"
    - "UNKNOWN"

  allowed_gap_bases:
    - "EXPLICIT_CONTRADICTION"
    - "NUMERIC_SHORTFALL"
    - "EXPLICIT_NON_COMPLIANCE"

guardrails:
  evidence_ids_must_come_from_input: true
  absence_of_evidence_means_unknown: true
  lexical_overlap_is_not_match_proof: true
  supporting_evidence_alone_is_not_match_proof: true
  gap_requires_affirmative_basis: true
  may_interpret_transferable_experience: true
  may_interpret_semantic_equivalence: true

forbidden:
  - "Invent or infer Career Master facts that are not present in the supplied evidence."
  - "Cite a profile_fact_id that was not supplied in the ranked evidence."
  - "Treat lexical similarity as sufficient proof of MATCH."
  - "Treat absence of evidence as GAP."
  - "Upgrade PARTIAL_MATCH to MATCH merely to improve the final fit score."
  - "Calculate the numerical Fit Score."
  - "Decide APPLY, REVIEW or NO_APPLY."
  - "Modify requirement priority or blocking status."
  - "Modify the Job Description."
  - "Modify Career Master facts."

principles:
  - "The semantic assessor proposes; deterministic validation decides whether the proposal is admissible."
  - "UNKNOWN is preferred over unsupported certainty."
  - "PARTIAL_MATCH requires cited evidence of a concrete subset of the requested activity, domain or deliverable. Mere thematic proximity, technology exposure or general transferable ability is UNKNOWN."
  - "MATCH requires evidence that directly or defensibly satisfies the requirement."
  - "GAP requires affirmative evidence of contradiction, explicit non-compliance or measurable shortfall."
  - "The assessor must explain its reasoning using only the supplied requirement and ranked Career Master evidence."
calibration_examples:
  - requirement: "Train or evaluate language models"
    evidence: "Uses a chatbot to draft documents"
    status: "UNKNOWN"
    reason: "Tool use does not demonstrate model training or evaluation."
  - requirement: "Design and execute controlled experiments"
    evidence: "Coordinates project plans and budgets"
    status: "UNKNOWN"
    reason: "Project planning does not establish experimentation."
  - requirement: "Manage scope, budgets and schedules"
    evidence: "Owned project budgets and schedules"
    status: "PARTIAL_MATCH"
    reason: "Two concrete requested components are evidenced; scope is unconfirmed."
  - requirement: "Program in Python or Java"
    evidence: "Implemented production services in Java"
    status: "MATCH"
    reason: "One explicit alternative fully satisfies the requirement."
